name: windows編譯
on: push

jobs:
  build_to_exe:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: 使用PyInstaller打包exe
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: "3.x"
          spec: "test.py"
          requirements: "requirements.txt"
          options: --onefile, --name "test"
          upload_exe_with_name: "test-exe"
