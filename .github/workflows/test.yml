name: windows編譯
on: push

jobs:
  build_to_exe:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: 使用PyInstaller打包exe
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: "3.x"
          spec: "test.py"
          requirements: "requirements.txt"
          options: --onefile, --name "test"
          upload_exe_with_name: "test-exe"

  build_step_by_step:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: 設定 Python 環境
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 使用 PyInstaller 打包 exe
        run: pyinstaller --onefile --name "test" test.py

      - name: 上傳打包結果
        uses: actions/upload-artifact@v4
        with:
          name: test-exe
          path: dist/test.exe
